spring.application.name=FitnessCRMJava


# --- Подключение к SQL Server ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FitnessCRM;encrypt=true;trustServerCertificate=true
spring.datasource.username=fitnesscrm_app
spring.datasource.password=${FITNESSCRM_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
