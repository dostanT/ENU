<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Филиалы</title>
</head>
<body>
<h1>Список филиалов</h1>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Код</th>
        <th>Название</th>
        <th>Адрес</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="branch : ${branches}">
        <td th:text="${branch.id}"></td>
        <td th:text="${branch.code}"></td>
        <td th:text="${branch.name}"></td>
        <td th:text="${branch.address}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
